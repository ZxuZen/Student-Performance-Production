name: CI/CD MLflow & Docker Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/student_data_clean.csv"
  TARGET_VAR: "G3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Environment Variables
        run: |
          echo "Dataset URL: $CSV_URL"
          echo "Target Variable: $TARGET_VAR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "
          import mlflow
          runs = mlflow.search_runs(experiment_ids=['0'], order_by=['start_time DESC'], max_results=1)
          if runs.empty:
              raise Exception('No MLflow runs found!')
          print(runs.iloc[0]['run_id'])
          ")

          if [ -z "$RUN_ID" ]; then
            echo "Error: RUN_ID tidak ditemukan!"
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Model berhasil dibuat: $RUN_ID"

      - name: Build Docker Model Image
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "student_model"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag student_model ${{ secrets.DOCKER_HUB_USERNAME }}/student_model:latest

      - name: Push Docker Image to Hub
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student_model:latest
