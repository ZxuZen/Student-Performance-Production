name: CI/CD MLflow & Docker Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/student_data_clean.csv"
  TARGET_VAR: "G3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Environment Variables
        run: |
          echo "Dataset URL: $CSV_URL"
          echo "Target Variable: $TARGET_VAR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run MLflow Project and get run_id
        run: |
          # Run MLflow project and capture the run ID from output
          mlflow run MLProject --env-manager=local 2>&1 | tee mlflow_output.log

          # Extract run_id using a dedicated Python script (avoids shell quoting issues)
          cat > get_run_id.py << 'EOF'
import mlflow
import sys

# Try searching all experiments
runs = mlflow.search_runs(order_by=["start_time DESC"], max_results=1)
if runs.empty:
    print("ERROR: No MLflow runs found!", file=sys.stderr)
    sys.exit(1)

run_id = runs.iloc[0]["run_id"]
# Only print the run_id, nothing else
print(run_id, end="")
EOF

          RUN_ID=$(python get_run_id.py)
          echo "DEBUG: Extracted RUN_ID='$RUN_ID'"

          if [ -z "$RUN_ID" ]; then
            echo "Error: RUN_ID tidak ditemukan!"
            echo "=== MLflow output log ==="
            cat mlflow_output.log
            echo "=== mlruns directory ==="
            find mlruns/ -maxdepth 3 -type d 2>/dev/null || echo "mlruns/ not found"
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Model berhasil dibuat dengan RUN_ID: $RUN_ID"

      - name: Build Docker Model Image
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "student_model"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag student_model ${{ secrets.DOCKER_HUB_USERNAME }}/student_model:latest

      - name: Push Docker Image to Hub
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student_model:latest
